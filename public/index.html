<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jedi Data Archives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Star Wars</h1>
    <p>Welcome to the Star Wars Web!</p>

    <p id="error" class="text-danger"></p>

    <form method="post" id="characterForm" class="w-75 d-flex align-items-center gap-3">
        <label for="characterName" class="form-label text-nowrap">Character Name:</label>
        <input type="text" id="characterName" name="characterName" class="form-control">

        <label for="characterRole" class="form-label text-nowrap">Character Role:</label>
        <select id="characterRole" name="characterRole" class="form-control  text-nowrap">
            <option value="" disabled selected>Select a role</option>
        </select>

        <label for="characterPlanet" class="form-label text-nowrap">Character Planet:</label>
        <input type="text" id="characterPlanet" name="characterPlanet" class="form-control">

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <h2 class="mt-4">Characters</h2>
    <ul id="characterList"></ul>

    <script src="script.js"></script>
</body>
</html>
